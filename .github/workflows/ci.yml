name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The report job is dispatch-only on purpose. It has to reach a vCenter, which
  # a GitHub-hosted runner cannot do, so putting it on a nightly schedule would
  # only produce a job that fails every night. Trigger it from a runner that has
  # network access to the vCenters listed in the VCENTER_LIST secret.
  workflow_dispatch:
    inputs:
      format:
        description: "Output format"
        required: false
        default: "csv"
        type: choice
        options: [csv, json, html]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest tests/ -q --cov=src --cov-report=term-missing

  report:
    name: Generate report
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write vcenters_list.txt from secret
        env:
          VCENTER_LIST: ${{ secrets.VCENTER_LIST }}
        run: printf '%s\n' "$VCENTER_LIST" > vcenters_list.txt

      - name: Run report
        env:
          VCENTER_DEFAULT_USER: ${{ secrets.VCENTER_DEFAULT_USER }}
          VCENTER_DEFAULT_PASSWORD: ${{ secrets.VCENTER_DEFAULT_PASSWORD }}
          REPORT_FORMAT: ${{ inputs.format }}
        run: |
          python main.py \
            --format "$REPORT_FORMAT" \
            --output "vm_report.$REPORT_FORMAT" \
            --workers 8

      - name: Upload report as artifact
        uses: actions/upload-artifact@v5
        with:
          name: vm-report-${{ github.run_id }}
          path: vm_report.*
          retention-days: 30
